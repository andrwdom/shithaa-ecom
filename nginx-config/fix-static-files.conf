# Quick fix for Next.js static file serving issue
# Add this to your existing Nginx configuration

# Critical: Handle Next.js static files with proper MIME types
location /_next/static/ {
    # Point to the actual Next.js build directory
    alias /var/www/shithaa-ecom/frontend/.next/static/;
    
    # Set proper MIME types
    location ~* \.(js)$ {
        add_header Content-Type "application/javascript; charset=utf-8";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    location ~* \.(css)$ {
        add_header Content-Type "text/css; charset=utf-8";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    location ~* \.(json)$ {
        add_header Content-Type "application/json; charset=utf-8";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    location ~* \.(woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Default for other static files
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# Handle Next.js public files
location /static/ {
    alias /var/www/shithaa-ecom/frontend/public/;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# Handle favicon and other root files
location ~* \.(ico|png|jpg|jpeg|gif|svg|webp)$ {
    root /var/www/shithaa-ecom/frontend/public;
    expires 1y;
    add_header Cache-Control "public, immutable";
}
