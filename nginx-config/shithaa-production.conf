        application/x-httpd-php78
        application/x-httpd-php79
        application/x-httpd-php80
        application/x-httpd-php81
        application/x-httpd-php82
        application/x-httpd-php83
        application/x-httpd-php84
        application/x-httpd-php85
        application/x-httpd-php86
        application/x-httpd-php87
        application/x-httpd-php88
        application/x-httpd-php89
        application/x-httpd-php90
        application/x-httpd-php91
        application/x-httpd-php92
        application/x-httpd-php93
        application/x-httpd-php94
        application/x-httpd-php95
        application/x-httpd-php96
        application/x-httpd-php97
        application/x-httpd-php98
        application/x-httpd-php99
        application/x-httpd-php100
        image/svg+xml;
    
    # Brotli compression (if available)
    brotli on;
    brotli_comp_level 6;
    brotli_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # ===============================================
    # STATIC FILE HANDLING
    # ===============================================
    
    # Next.js static files with aggressive caching
    location /_next/static/ {
        proxy_pass http://frontend_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Aggressive caching for static assets
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";
        expires 1y;
        
        # Handle different file types
        location ~* \.(js)$ {
            add_header Content-Type "application/javascript; charset=utf-8";
        }
        
        location ~* \.(css)$ {
            add_header Content-Type "text/css; charset=utf-8";
        }
        
        location ~* \.(json)$ {
            add_header Content-Type "application/json; charset=utf-8";
        }
        
        location ~* \.(woff|woff2|ttf|eot)$ {
            add_header Content-Type "font/woff2";
        }
    }
    
    # Next.js public static files
    location /static/ {
        proxy_pass http://frontend_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }
    
    # Product images with format negotiation
    location /images/ {
        alias /var/www/shithaa-ecom/uploads/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept";
        
        # Enable format negotiation for modern image formats
        location ~* \.(webp)$ {
            add_header Content-Type "image/webp";
            add_header Vary "Accept";
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        
        location ~* \.(avif)$ {
            add_header Content-Type "image/avif";
            add_header Vary "Accept";
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        
        # Handle JPEG/PNG fallbacks
        location ~* \.(jpg|jpeg|png)$ {
            add_header Vary "Accept";
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
    
    # Uploads directory (alternative path)
    location /uploads/ {
        alias /var/www/shithaa-ecom/uploads/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept";
        
        # Format negotiation
        location ~* \.(webp|avif)$ {
            add_header Vary "Accept";
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        
        location ~* \.(jpg|jpeg|png)$ {
            add_header Vary "Accept";
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
    
    # ===============================================
    # API ROUTING
    # ===============================================
    
    # Webhook endpoints (CRITICAL: must come before /api/)
    location /webhook/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Webhook specific settings
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        
        # No caching for webhooks
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # API endpoints with rate limiting
    location /api/ {
        # Rate limiting
        limit_req zone=api burst=20 nodelay;
        
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_cache_bypass $http_upgrade;
        
        # API specific timeouts
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        
        # No caching for API responses
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # Login endpoints with stricter rate limiting
    location ~* /api/(user|auth)/(login|register) {
        limit_req zone=login burst=5 nodelay;
        
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    
    # ===============================================
    # FRONTEND ROUTING
    # ===============================================
    
    # All other requests go to Next.js frontend
    location / {
        # Rate limiting for general requests
        limit_req zone=general burst=50 nodelay;
        
        proxy_pass http://frontend_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_cache_bypass $http_upgrade;
        
        # Frontend specific timeouts
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        
        # Cache headers for frontend
        add_header Cache-Control "public, max-age=300, s-maxage=3600";
    }
    
    # ===============================================
    # SPECIAL FILES
    # ===============================================
    
    # Robots.txt
    location = /robots.txt {
        proxy_pass http://frontend_backend;
        add_header Cache-Control "public, max-age=86400";
        expires 1d;
    }
    
    # Sitemap
    location = /sitemap.xml {
        proxy_pass http://frontend_backend;
        add_header Cache-Control "public, max-age=86400";
        expires 1d;
    }
    
    # Favicon and manifest files
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|avif|woff|woff2|ttf|eot)$ {
        proxy_pass http://frontend_backend;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept";
    }
    
    # ===============================================
    # ERROR PAGES
    # ===============================================
    
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    # Custom error pages
    location = /404.html {
        proxy_pass http://frontend_backend;
    }
    
    location = /50x.html {
        proxy_pass http://frontend_backend;
    }
}

# ===============================================
# ADMIN PANEL CONFIGURATION (admin.shithaa.in)
# ===============================================

# HTTP to HTTPS redirect for admin
server {
    listen 80;
    listen [::]:80;
    server_name admin.shithaa.in;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    return 301 https://$server_name$request_uri;
}

# HTTPS Admin Panel
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.shithaa.in;
    
    # SSL Configuration (same as main site)
    ssl_certificate /etc/letsencrypt/live/shithaa.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shithaa.in/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    # Security headers for admin
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Admin-specific CSP
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; connect-src 'self' https://shithaa.in; frame-src 'self'; object-src 'none'; base-uri 'self';" always;
    
    # Rate limiting for admin
    limit_req zone=general burst=30 nodelay;
    
    # Admin static files
    location / {
        proxy_pass http://admin_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Admin specific timeouts
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        
        # Cache headers for admin
        add_header Cache-Control "public, max-age=3600";
    }
    
    # Admin API requests
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    
    # Admin static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff|woff2|ttf|eot)$ {
        proxy_pass http://admin_backend;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

