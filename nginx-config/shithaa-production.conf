# ===============================================
# SHITHAA E-COMMERCE PRODUCTION NGINX CONFIG
# ===============================================
# Comprehensive nginx configuration for Shithaa.in
# Optimized for Next.js frontend, Express backend, and React admin panel
# 
# Installation:
# 1. sudo cp nginx-config/shithaa-production.conf /etc/nginx/sites-available/shithaa.conf
# 2. sudo ln -sf /etc/nginx/sites-available/shithaa.conf /etc/nginx/sites-enabled/
# 3. sudo nginx -t && sudo systemctl reload nginx

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

# Upstream servers for load balancing (if needed in future)
upstream frontend_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream api_backend {
    server 127.0.0.1:4000;
    keepalive 32;
}

upstream admin_backend {
    server 127.0.0.1:4173;
    keepalive 32;
}

# ===============================================
# MAIN SITE CONFIGURATION (shithaa.in)
# ===============================================

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name shithaa.in www.shithaa.in;
    
    # Security headers for HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS Main Site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shithaa.in www.shithaa.in;
    
    # ===============================================
    # SSL CONFIGURATION
    # ===============================================
    ssl_certificate /etc/letsencrypt/live/shithaa.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shithaa.in/privkey.pem;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/shithaa.in/chain.pem;
    
    # ===============================================
    # SECURITY HEADERS
    # ===============================================
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    
    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://checkout.razorpay.com https://js.stripe.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; connect-src 'self' https://api.razorpay.com https://api.stripe.com https://www.google-analytics.com; frame-src 'self' https://checkout.razorpay.com https://js.stripe.com; object-src 'none'; base-uri 'self';" always;
    
    # ===============================================
    # PERFORMANCE OPTIMIZATION
    # ===============================================
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        text/csv
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        application/x-javascript
        application/x-httpd-php
        application/x-httpd-fastphp
        application/x-httpd-eruby
        application/x-httpd-cgi
        application/x-httpd-php4
        application/x-httpd-php5
        application/x-httpd-php7
        application/x-httpd-php8
        application/x-httpd-php9
        application/x-httpd-php10
        application/x-httpd-php11
        application/x-httpd-php12
        application/x-httpd-php13
        application/x-httpd-php14
        application/x-httpd-php15
        application/x-httpd-php16
        application/x-httpd-php17
        application/x-httpd-php18
        application/x-httpd-php19
        application/x-httpd-php20
        application/x-httpd-php21
        application/x-httpd-php22
        application/x-httpd-php23
        application/x-httpd-php24
        application/x-httpd-php25
        application/x-httpd-php26
        application/x-httpd-php27
        application/x-httpd-php28
        application/x-httpd-php29
        application/x-httpd-php30
        application/x-httpd-php31
        application/x-httpd-php32
        application/x-httpd-php33
        application/x-httpd-php34
        application/x-httpd-php35
        application/x-httpd-php36
        application/x-httpd-php37
        application/x-httpd-php38
        application/x-httpd-php39
        application/x-httpd-php40
        application/x-httpd-php41
        application/x-httpd-php42
        application/x-httpd-php43
        application/x-httpd-php44
        application/x-httpd-php45
        application/x-httpd-php46
        application/x-httpd-php47
        application/x-httpd-php48
        application/x-httpd-php49
        application/x-httpd-php50
        application/x-httpd-php51
        application/x-httpd-php52
        application/x-httpd-php53
