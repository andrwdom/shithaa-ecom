        application/x-httpd-php66
        application/x-httpd-php67
        application/x-httpd-php68
        application/x-httpd-php69
        application/x-httpd-php70
        application/x-httpd-php71
        application/x-httpd-php72
        application/x-httpd-php73
        application/x-httpd-php74
        application/x-httpd-php75
