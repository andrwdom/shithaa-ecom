# Cloudflare-Optimized Nginx Configuration for Shithaa E-commerce
# This configuration is optimized for Cloudflare CDN caching and performance

server {
    listen 80;
    server_name shithaa.in www.shithaa.in admin.shithaa.in;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Cloudflare-specific headers
    add_header CF-Cache-Status $upstream_http_cf_cache_status always;
    add_header CF-Ray $http_cf_ray_id always;

    # Frontend (Next.js) - Proxy to Next.js server
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-Ray $http_cf_ray_id;
        proxy_cache_bypass $http_upgrade;
        
        # Cache headers for Cloudflare
        add_header Cache-Control "public, max-age=300, s-maxage=3600";
    }

    # Handle Next.js static files with Cloudflare optimization
    location /_next/static/ {
        alias /var/www/shithaa-ecom/frontend/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Vary "Accept-Encoding";
        
        # Cloudflare-specific headers
        add_header CF-Cache-Status "HIT" always;
        
        # Ensure proper MIME types
        location ~* \.(js)$ {
            add_header Content-Type "application/javascript; charset=utf-8";
        }
        
        location ~* \.(css)$ {
            add_header Content-Type "text/css; charset=utf-8";
        }
        
        location ~* \.(json)$ {
            add_header Content-Type "application/json; charset=utf-8";
        }
    }

    # Handle public static files with Cloudflare optimization
    location /static/ {
        alias /var/www/shithaa-ecom/frontend/public/;
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Vary "Accept-Encoding";
        
        # Cloudflare-specific headers
        add_header CF-Cache-Status "HIT" always;
    }

    # Handle uploaded images with Cloudflare optimization
    location /images/ {
        alias /var/www/shithaa-ecom/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Vary "Accept";
        
        # Cloudflare-specific headers
        add_header CF-Cache-Status "HIT" always;
        
        # Enable format negotiation for modern image formats
        location ~* \.(webp|avif)$ {
            add_header Vary "Accept";
            add_header Content-Type "image/webp";
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
        }
        
        # Handle AVIF format
        location ~* \.avif$ {
            add_header Content-Type "image/avif";
            add_header Vary "Accept";
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
        }
        
        # Handle WebP format
        location ~* \.webp$ {
            add_header Content-Type "image/webp";
            add_header Vary "Accept";
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
        }
        
        # Handle JPEG/PNG fallbacks
        location ~* \.(jpg|jpeg|png)$ {
            add_header Vary "Accept";
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
        }
    }

    # Handle uploads directory (for product images)
    location /uploads/ {
        alias /var/www/shithaa-ecom/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Vary "Accept";
        
        # Cloudflare-specific headers
        add_header CF-Cache-Status "HIT" always;
        
        # Enable format negotiation
        location ~* \.(webp|avif)$ {
            add_header Vary "Accept";
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
        }
        
        location ~* \.(jpg|jpeg|png)$ {
            add_header Vary "Accept";
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
        }
    }

    # API requests - proxy to backend with minimal caching
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_cache_bypass $http_upgrade;
        
        # Minimal caching for API responses
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Admin Panel - proxy to admin server
    location /admin {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_cache_bypass $http_upgrade;
        
        # Cache admin assets
        add_header Cache-Control "public, max-age=3600";
    }

    # Handle favicon and manifest files
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Vary "Accept";
        
        # Cloudflare-specific headers
        add_header CF-Cache-Status "HIT" always;
    }

    # Handle robots.txt and sitemap.xml
    location ~* \.(txt|xml)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Gzip compression for better Cloudflare performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
}
