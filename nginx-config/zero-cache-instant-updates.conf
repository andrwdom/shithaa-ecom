# ===============================================
# ZERO-CACHE NGINX CONFIG FOR INSTANT UPDATES
# ===============================================
# Use this configuration to ensure users get updates INSTANTLY
# 
# Installation:
# 1. sudo cp nginx-config/zero-cache-instant-updates.conf /etc/nginx/sites-available/shithaa.conf
# 2. sudo ln -sf /etc/nginx/sites-available/shithaa.conf /etc/nginx/sites-enabled/
# 3. sudo nginx -t && sudo systemctl reload nginx

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

# Upstream servers
upstream frontend_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream api_backend {
    server 127.0.0.1:4000;
    keepalive 64;
}

upstream admin_backend {
    server 127.0.0.1:4173;
    keepalive 32;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name shithaa.in www.shithaa.in;
    return 301 https://$server_name$request_uri;
}

# MAIN HTTPS SERVER
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shithaa.in www.shithaa.in;
    
    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/shithaa.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shithaa.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;
    
    # Client body size
    client_max_body_size 50M;
    
    # Timeouts
    client_body_timeout 30s;
    client_header_timeout 30s;
    keepalive_timeout 65s;
    send_timeout 30s;
    
    # ===============================================
    # CRITICAL: Next.js Static Assets (LONG CACHE)
    # ===============================================
    # These files have build IDs in the filename, so they're immutable
    location /_next/static/ {
        proxy_pass http://frontend_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 🚀 LONG CACHE = Safe because build ID changes on each deploy
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
        
        # Performance optimizations
        tcp_nodelay on;
        tcp_nopush on;
    }
    
    # ===============================================
    # CRITICAL: Product Images (MEDIUM CACHE)
    # ===============================================
    location /uploads/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Medium cache for product images
        add_header Cache-Control "public, max-age=2592000" always; # 30 days
        expires 30d;
    }
    
    # ===============================================
    # CRITICAL: Static Images (LONG CACHE)
    # ===============================================
    location /images/ {
        proxy_pass http://frontend_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        # Long cache for static branding images
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
    }
    
    # ===============================================
    # CRITICAL: API Routes (ZERO CACHE)
    # ===============================================
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 🔥 ZERO CACHE for API = Always fresh data
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        
        # Timeouts for API
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }
    
    # ===============================================
    # CRITICAL: All Other Routes (ZERO CACHE)
    # ===============================================
    # HTML pages, Next.js pages, etc - ALWAYS fresh
    location / {
        limit_req zone=general burst=50 nodelay;
        
        proxy_pass http://frontend_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # 🔥 ZERO CACHE for HTML pages = INSTANT updates
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        
        # Timeouts
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }
    
    # ===============================================
    # SPECIAL FILES
    # ===============================================
    location = /robots.txt {
        proxy_pass http://frontend_backend;
        add_header Cache-Control "public, max-age=86400" always; # 1 day
    }
    
    location = /sitemap.xml {
        proxy_pass http://frontend_backend;
        add_header Cache-Control "public, max-age=86400" always; # 1 day
    }
    
    location = /favicon.ico {
        proxy_pass http://frontend_backend;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
    }
    
    # ===============================================
    # ERROR PAGES
    # ===============================================
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}

