# Nginx configuration for Shithaa.in
# This should be placed in /etc/nginx/sites-available/shithaa.conf
# and symlinked to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name shithaa.in www.shithaa.in;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name shithaa.in www.shithaa.in;
    
    # SSL Configuration (adjust paths as needed)
    ssl_certificate /etc/letsencrypt/live/shithaa.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shithaa.in/privkey.pem;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    
    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private must-revalidate auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;
    
    # Root directory for the frontend build (not used when proxying)
    # root /var/www/shithaa-ecom/frontend/.next;
    
    # Handle Next.js static files - proxy to Next.js server for proper MIME types
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Add caching headers
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }
    
    # Handle public static files - proxy to Next.js server
    location /static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Add caching headers
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }
    
    # Handle uploaded images with format negotiation
    location /images/ {
        alias /var/www/shithaa-ecom/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Enable format negotiation for modern image formats
        location ~* \.(webp|avif)$ {
            add_header Vary "Accept";
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Handle AVIF format negotiation
        location ~* \.avif$ {
            add_header Content-Type "image/avif";
            add_header Vary "Accept";
        }
        
        # Handle WebP format
        location ~* \.webp$ {
            add_header Content-Type "image/webp";
            add_header Vary "Accept";
        }
        
        # Handle JPEG/PNG fallbacks
        location ~* \.(jpg|jpeg|png)$ {
            add_header Vary "Accept";
        }
    }
    
    # Handle API requests - proxy to backend
    location /api/ {
        # DYNAMIC CORS HANDLING
        # The Node.js backend now handles CORS, so we only need to pass the Origin header.
        # Nginx should NOT add its own CORS headers here, as it will conflict with the application.
        
        # Remove hardcoded and incorrect CORS headers
        # add_header 'Access-Control-Allow-Origin' 'https://admin.shithaa.in' always;
        # add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        # add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, token, x-requested-with, Accept, Origin, X-Requested-With, Cache-Control, x-csrf-token' always;
        # add_header 'Access-Control-Allow-Credentials' 'true' always;
        
        # The preflight request is now handled by the Node.js application's CORS middleware.
        # This entire block can be removed.
        # if ($request_method = 'OPTIONS') {
        #     ...
        #     return 204;
        # }
        
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
    
    # Handle all other requests - proxy to Next.js frontend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
    
    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    # Robots.txt
    location = /robots.txt {
        proxy_pass http://127.0.0.1:3000;
    }
    
    # Sitemap
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3000;
    }
}

# Admin subdomain configuration
server {
    listen 80;
    server_name admin.shithaa.in;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.shithaa.in;
    
    # SSL Configuration (adjust paths as needed)
    ssl_certificate /etc/letsencrypt/live/shithaa.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shithaa.in/privkey.pem;
    
    # SSL Security Settings (same as main site)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Root directory for admin build
    root /var/www/shithaa-ecom/admin/dist;
    index index.html;
    
    # Handle admin static files
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Handle API requests for admin
    location /api/ {
        # CORS is now handled by the Node.js backend.
        # Nginx should just proxy the request.
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
