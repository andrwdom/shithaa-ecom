# Improved Next.js static file serving configuration
# This should replace the existing /_next/static/ location block

# Handle Next.js static files with better error handling
location /_next/static/ {
    # First try to serve from Next.js server
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Add proper caching headers
    add_header Cache-Control "public, max-age=31536000, immutable";
    expires 1y;
    
    # Handle errors gracefully
    proxy_intercept_errors on;
    error_page 404 = @fallback_static;
    
    # Set proper MIME types for different file types
    location ~* \.(js)$ {
        add_header Content-Type "application/javascript; charset=utf-8";
        proxy_pass http://127.0.0.1:3000;
    }
    
    location ~* \.(css)$ {
        add_header Content-Type "text/css; charset=utf-8";
        proxy_pass http://127.0.0.1:3000;
    }
    
    location ~* \.(json)$ {
        add_header Content-Type "application/json; charset=utf-8";
        proxy_pass http://127.0.0.1:3000;
    }
    
    location ~* \.(woff|woff2|ttf|eot)$ {
        add_header Content-Type "font/woff2";
        proxy_pass http://127.0.0.1:3000;
    }
}

# Fallback for static files if Next.js server fails
location @fallback_static {
    # Try to serve directly from filesystem as fallback
    alias /var/www/shithaa-ecom/frontend/.next/static/;
    
    # Set proper MIME types
    location ~* \.(js)$ {
        add_header Content-Type "application/javascript; charset=utf-8";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    location ~* \.(css)$ {
        add_header Content-Type "text/css; charset=utf-8";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    location ~* \.(json)$ {
        add_header Content-Type "application/json; charset=utf-8";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Default for other static files
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# Handle Next.js public files
location /static/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    add_header Cache-Control "public, max-age=31536000, immutable";
    expires 1y;
}

# Handle favicon and other root files
location ~* \.(ico|png|jpg|jpeg|gif|svg|webp)$ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    expires 1y;
    add_header Cache-Control "public, immutable";
}
